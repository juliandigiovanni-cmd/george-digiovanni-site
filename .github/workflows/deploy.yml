# Builds the site and publishes _site to GitHub Pages on every push to main.
# This replaces the zip-and-extract through cPanel that the Bluehost site used;
# docs/deploy-runbook.md records that process.
#
# Pages ignores .htaccess, so deploy/htaccess plays no part here. Its redirects
# live in src/404.njk, and HTTPS is the "Enforce HTTPS" setting on the repo.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. A newer push waits for the running one rather than
# cancelling it, so a half-finished deploy is never abandoned.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
